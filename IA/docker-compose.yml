# =============================================================================
# NutriGuide IA: n8n (asistente RAG e ingesta de documentos) + Qdrant (base vectorial)
#
# No hace falta arrancarlo a mano: backend/docker-compose.yml lo incluye y Spring Boot
# lo levanta al ejecutar la aplicación (IntelliJ o ./mvnw spring-boot:run).
# También funciona solo:  cd IA && docker compose up -d
#
# Las variables se leen de IA/.env (ver .env.example). Si no existe, se usan los valores
# por defecto de desarrollo: todo funciona salvo el chat, que necesita GEMINI_API_KEY.
#
# Al arrancar, n8n importa automáticamente las credenciales y el flujo nutriguide-ia.json
# y lo publica. No hay pasos manuales.
#
#   Editor de n8n:      http://localhost:5680
#   Panel de Qdrant:    http://localhost:6333/dashboard   (pide QDRANT_API_KEY)
# =============================================================================
name: nutriguide-ia

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: nutriguide-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-nutriguide-dev-qdrant}
    ports:
      - "127.0.0.1:${QDRANT_PUERTO:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:2.46.6
    container_name: nutriguide-n8n
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/nutriguide/setup/iniciar-n8n.sh"]
    environment:
      # --- n8n (no cambies N8N_ENCRYPTION_KEY después del primer arranque)
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-nutriguide-dev-encryption-key}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:${N8N_PUERTO:-5680}/
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${TZ:-America/Bogota}
      TZ: ${TZ:-America/Bogota}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # El flujo lee estas variables desde expresiones ($env)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # --- valores usados para crear las credenciales y por el flujo
      NUTRIGUIDE_WEBHOOK_TOKEN: ${NUTRIGUIDE_WEBHOOK_TOKEN:-nutriguide-dev-token}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_HOST: ${GEMINI_HOST:-https://generativelanguage.googleapis.com}
      GEMINI_MODELO_CHAT: ${GEMINI_MODELO_CHAT:-models/gemini-3.5-flash-lite}
      GEMINI_MODELO_EMBEDDINGS: ${GEMINI_MODELO_EMBEDDINGS:-models/gemini-embedding-001}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-nutriguide-dev-qdrant}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.55}
    ports:
      # 5680 en el equipo para no chocar con otras instalaciones de n8n (5678)
      - "127.0.0.1:${N8N_PUERTO:-5680}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/setup:/opt/nutriguide/setup:ro
      - ./nutriguide-ia.json:/opt/nutriguide/nutriguide-ia.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

# Nombres fijos: los datos se conservan aunque se arranque desde otra carpeta o proyecto
volumes:
  qdrant_data:
    name: nutriguide-ia_qdrant_data
  n8n_data:
    name: nutriguide-ia_n8n_data
