# =============================================================================
# NUTRIGUIDE BACKEND - CONFIGURACIÓN PRINCIPAL (Spring Boot + PostgreSQL + pgvector)
# Las credenciales reales se leen desde variables de entorno.
# =============================================================================

spring.application.name=nutriguide-backend
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------------
# 1. CONEXIÓN A POSTGRESQL Y PGVECTOR
# Por defecto apunta al contenedor pgvector de docker-compose (puerto 5433)
# o puede configurarse mediante DB_HOST, DB_PORT, DB_NAME, DB_USERNAME y DB_PASSWORD.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:nutriguide_db}
spring.datasource.username=${DB_USERNAME:nutriguide}
spring.datasource.password=${DB_PASSWORD:nutriguide_dev_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# 2. LÍMITES DE SUBIDA DE ARCHIVOS PARA INGESTA RAG (.PDF y .TXT)
# -----------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
nutriguide.storage.upload-dir=${UPLOAD_DIR:./uploads/documentos}

# -----------------------------------------------------------------------------
# 3. CONFIGURACIÓN DE INTELIGENCIA ARTIFICIAL (GOOGLE GEMINI API)
# Importante: Nunca escribas claves privadas directamente en este archivo.
# Define la variable de entorno GEMINI_API_KEY en tu sistema.
# -----------------------------------------------------------------------------
ai.provider=gemini
ai.api.key=${GEMINI_API_KEY:}
ai.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# Servicio de Embeddings (separado del servicio de generación de lenguaje)
ai.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
ai.embedding.dimension=768
ai.embedding.fallback-enabled=${AI_EMBEDDING_FALLBACK_ENABLED:true}

# Servicio de Generación de Respuestas (LLM)
ai.llm.model=${GEMINI_LLM_MODEL:gemini-2.5-flash}
ai.llm.temperature=0.2
ai.llm.max-output-tokens=1024

# Control de tiempos de espera y reintentos ante límites de solicitudes (Rate Limits)
ai.http.timeout-seconds=30
ai.http.max-retries=2

# -----------------------------------------------------------------------------
# 4. PARÁMETROS DEL FLUJO RAG Y BÚSQUEDA VECTORIAL EN PGVECTOR
# -----------------------------------------------------------------------------
rag.chunk.max-chars=750
rag.chunk.overlap-chars=120
rag.retrieval.top-k=4
rag.retrieval.min-similarity=0.25

# -----------------------------------------------------------------------------
# 5. SEGURIDAD CORS Y CARGA INICIAL DE DATOS SEMILLA
# -----------------------------------------------------------------------------
nutriguide.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
nutriguide.seed.enabled=${SEED_ENABLED:true}

