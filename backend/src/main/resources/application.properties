# =============================================================================
# NUTRIGUIDE BACKEND - CONFIGURACIÓN PRINCIPAL (Spring Boot + PostgreSQL + pgvector)
# Las credenciales se leen de variables de entorno. Nunca escribas claves aquí.
# =============================================================================

spring.application.name=nutriguide-backend
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------------
# 1. POSTGRESQL + PGVECTOR
# Por defecto apunta al contenedor de docker-compose (puerto 5434 del host).
# La contraseña por defecto es solo para desarrollo local con docker-compose.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:nutriguide_db}
spring.datasource.username=${DB_USERNAME:nutriguide}
spring.datasource.password=${DB_PASSWORD:nutriguide_dev_pass}

# El esquema y los datos iniciales salen de db/schema.sql y db/data.sql (única fuente).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# -----------------------------------------------------------------------------
# 2. CARGA DE DOCUMENTOS PARA EL RAG (.pdf y .txt)
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
nutriguide.storage.upload-dir=${UPLOAD_DIR:./uploads/documentos}

# -----------------------------------------------------------------------------
# 3. INTELIGENCIA ARTIFICIAL (Google Gemini API)
# Define GEMINI_API_KEY como variable de entorno. Sin ella, el catálogo, las
# recetas y la biblioteca funcionan, pero el chat responde 503 y los documentos
# quedan PENDIENTES de indexar (no existe ningún modo simulado).
# -----------------------------------------------------------------------------
ai.api.key=${GEMINI_API_KEY:}
ai.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# Servicio de embeddings (separado del de generación)
ai.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
# Debe coincidir con vector(768) de db/schema.sql
ai.embedding.dimension=768
ai.embedding.batch-size=50

# Servicio de generación de respuestas (LLM)
ai.llm.model=${GEMINI_LLM_MODEL:gemini-2.5-flash}
ai.llm.temperature=0.2
ai.llm.max-output-tokens=2048

# Tiempos de espera y reintentos ante límites de solicitudes (HTTP 429/5xx)
ai.http.timeout-seconds=60
ai.http.max-retries=3

# -----------------------------------------------------------------------------
# 4. PARÁMETROS DEL RAG
# min-similarity: similitud coseno mínima (0..1) para aceptar un fragmento.
# Ajustar tras probar con preguntas reales del dominio.
# -----------------------------------------------------------------------------
rag.chunk.max-chars=900
rag.chunk.overlap-chars=150
rag.retrieval.top-k=4
rag.retrieval.min-similarity=${RAG_MIN_SIMILARITY:0.55}

# -----------------------------------------------------------------------------
# 5. SEGURIDAD
# CORS: orígenes del frontend separados por comas. Por defecto, cualquier puerto de localhost
#   (Live Server, python -m http.server...). En producción, indica el dominio real.
# ADMIN_TOKEN: obligatorio para crear, modificar o borrar (cabecera X-Admin-Token).
#   Si está vacío, esas operaciones quedan deshabilitadas.
# Límite de preguntas al chat por IP y minuto (protege la cuota del proveedor de IA).
# -----------------------------------------------------------------------------
nutriguide.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
nutriguide.admin.token=${ADMIN_TOKEN:}
nutriguide.chat.max-requests-per-minute=${CHAT_RATE_LIMIT:20}

# Indexa al arrancar los documentos educativos de src/main/resources/initial-docs
nutriguide.seed.documents-enabled=${SEED_DOCUMENTS:true}
