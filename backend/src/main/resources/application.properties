# =============================================================================
# NUTRIGUIDE BACKEND - CONFIGURACIÓN PRINCIPAL (Spring Boot + PostgreSQL)
#
# Para desarrollar basta con abrir el proyecto en IntelliJ y ejecutar
# NutriGuideApplication (o ./mvnw spring-boot:run) con Docker abierto:
#   - Spring levanta PostgreSQL, n8n y Qdrant con docker-compose.yml.
#   - Lee los valores opcionales de backend/.env e IA/.env (no hay que exportar nada).
#   - Sirve el frontend en http://localhost:8080
# Sin ningún .env todo funciona con valores de desarrollo, salvo el chat, que
# necesita GEMINI_API_KEY en IA/.env. Nunca escribas claves en este archivo.
# =============================================================================

spring.application.name=nutriguide-backend
server.port=${SERVER_PORT:8080}

# Valores opcionales de los .env (rutas relativas a la carpeta backend, que es el
# directorio de trabajo por defecto de IntelliJ y de Maven para este módulo)
spring.config.import=optional:file:.env[.properties],optional:file:../IA/.env[.properties]

# -----------------------------------------------------------------------------
# 1. INFRAESTRUCTURA CON DOCKER COMPOSE (solo al ejecutar en desarrollo; nunca en tests)
# start-only: los contenedores siguen encendidos entre ejecuciones (arrancar n8n tarda).
# Para apagarlos:  docker compose stop   (desde la carpeta backend)
# -----------------------------------------------------------------------------
spring.docker.compose.file=./docker-compose.yml
spring.docker.compose.lifecycle-management=start-only
# Ejecuta siempre "docker compose up": arranca lo que falte sin tocar lo que ya está encendido
spring.docker.compose.start.skip=never
spring.docker.compose.readiness.timeout=5m

# -----------------------------------------------------------------------------
# 2. POSTGRESQL
# Por defecto apunta al contenedor de docker-compose (puerto 5434 del host).
# La contraseña por defecto es solo para desarrollo local con docker-compose.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:nutriguide_db}
spring.datasource.username=${DB_USERNAME:nutriguide}
spring.datasource.password=${DB_PASSWORD:nutriguide_dev_pass}

# El esquema y los datos iniciales salen de db/schema.sql y db/data.sql (única fuente).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# -----------------------------------------------------------------------------
# 3. FRONTEND
# El backend sirve la carpeta ../frontend: http://localhost:8080 abre la aplicación.
# (Live Server u otro servidor estático también funcionan gracias a CORS.)
# -----------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:../frontend/

# -----------------------------------------------------------------------------
# 4. CARGA DE DOCUMENTOS DE LA BIBLIOTECA (.pdf y .txt)
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
nutriguide.storage.upload-dir=${UPLOAD_DIR:./uploads/documentos}

# -----------------------------------------------------------------------------
# 5. ASISTENTE DE IA (flujo n8n + Qdrant + Google Gemini, carpeta IA/)
# El backend llama a los webhooks de n8n con la cabecera X-NutriGuide-Token.
# El token se toma de IA/.env (NUTRIGUIDE_WEBHOOK_TOKEN), así coincide siempre con n8n;
# sin IA/.env ambos usan el mismo valor de desarrollo.
# -----------------------------------------------------------------------------
nutriguide.ia.n8n-url=${N8N_URL:http://localhost:${N8N_PUERTO:5680}}
nutriguide.ia.webhook-token=${N8N_WEBHOOK_TOKEN:${NUTRIGUIDE_WEBHOOK_TOKEN:nutriguide-dev-token}}
nutriguide.ia.chat-timeout-seconds=90
nutriguide.ia.ingesta-timeout-seconds=300

# -----------------------------------------------------------------------------
# 6. SEGURIDAD
# CORS: orígenes del frontend separados por comas. Por defecto, cualquier puerto de localhost.
#   En producción, indica el dominio real.
# ADMIN_TOKEN: obligatorio para crear, modificar o borrar (cabecera X-Admin-Token).
#   Si está vacío, esas operaciones quedan deshabilitadas.
# Límite de preguntas al chat por IP y minuto (protege la cuota del proveedor de IA).
# -----------------------------------------------------------------------------
nutriguide.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
nutriguide.admin.token=${ADMIN_TOKEN:}
nutriguide.chat.max-requests-per-minute=${CHAT_RATE_LIMIT:20}

# Registra al arrancar los documentos educativos de src/main/resources/initial-docs
# (y los envía a n8n para indexarlos en Qdrant si el servicio de IA está configurado)
nutriguide.seed.documents-enabled=${SEED_DOCUMENTS:true}
