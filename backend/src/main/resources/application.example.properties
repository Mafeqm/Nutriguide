# =============================================================================
# NUTRIGUIDE BACKEND - ARCHIVO DE CONFIGURACIÓN DE EJEMPLO (SIN CREDENCIALES REALES)
# Copia o configura estas variables en tu entorno antes de desplegar.
# =============================================================================

spring.application.name=nutriguide-backend
server.port=8080

# Conexión a PostgreSQL con extensión pgvector
spring.datasource.url=jdbc:postgresql://localhost:5433/nutriguide_db
spring.datasource.username=TU_USUARIO_POSTGRES
spring.datasource.password=TU_PASSWORD_POSTGRES
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Límites para carga de documentos educativos (.pdf y .txt)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
nutriguide.storage.upload-dir=./uploads/documentos

# Proveedor de Inteligencia Artificial (Google Gemini API)
ai.provider=gemini
ai.api.key=${GEMINI_API_KEY}
ai.api.base-url=https://generativelanguage.googleapis.com/v1beta
ai.embedding.model=gemini-embedding-001
ai.embedding.dimension=768
ai.embedding.fallback-enabled=false
ai.llm.model=gemini-2.5-flash
ai.llm.temperature=0.2
ai.llm.max-output-tokens=1024

# Parámetros RAG
rag.chunk.max-chars=750
rag.chunk.overlap-chars=120
rag.retrieval.top-k=4
rag.retrieval.min-similarity=0.25

# Orígenes permitidos para el Frontend (Desarrollador 1)
nutriguide.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000
nutriguide.seed.enabled=true

