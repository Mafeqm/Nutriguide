spring.application.name=nutriguide-backend-test
spring.datasource.url=jdbc:h2:mem:nutriguide_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

ai.provider=gemini
ai.api.key=
ai.embedding.dimension=768
ai.embedding.fallback-enabled=true

rag.chunk.max-chars=600
rag.chunk.overlap-chars=100
rag.retrieval.top-k=3
rag.retrieval.min-similarity=0.20

nutriguide.seed.enabled=true
nutriguide.storage.upload-dir=./target/test-uploads

