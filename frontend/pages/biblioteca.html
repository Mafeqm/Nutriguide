<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f4a">
  <script>try{var t=JSON.parse(localStorage.getItem('ng:theme'));document.documentElement.dataset.theme=t||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
  <title>Biblioteca nutricional · NutriGuide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="../" data-page="biblioteca">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header id="site-header"></header>

  <main id="contenido">
    <section class="page-head" data-arts="wheat,drop,orange" style="--ph-img:url('../assets/images/arandanos.jpg')">
      <div class="container">
        <h1>Biblioteca nutricional</h1>
        <p class="lead">Recursos educativos sobre alimentación equilibrada, macronutrientes, vitaminas, hidratación y hábitos.</p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <form id="doc-form" class="toolbar" role="search" novalidate>
          <div class="field">
            <label for="doc-search">Buscar recurso</label>
            <input id="doc-search" type="search" placeholder="Ej.: hidratación, vitaminas…" autocomplete="off">
          </div>
          <button class="btn btn--primary" type="submit">Buscar</button>
        </form>
        <div id="doc-categories" class="chips" role="group" aria-label="Filtrar por categoría"></div>
        <p id="doc-count" class="muted small" aria-live="polite"></p>
        <div id="doc-grid" class="grid grid--3" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script type="module" src="../js/biblioteca.js"></script>
</body>
</html>
