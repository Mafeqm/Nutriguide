<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f4a">
  <script>try{var t=JSON.parse(localStorage.getItem('ng:theme'));document.documentElement.dataset.theme=t||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
  <title>Recetas · NutriGuide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="../" data-page="recetas">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header id="site-header"></header>

  <main id="contenido">
    <section class="page-head" data-arts="tomato,egg,lemon" style="--ph-img:url('../assets/images/desayuno-saludable.jpg')">
      <div class="container">
        <h1>Recetas</h1>
        <p class="lead">Ideas para cocinar con ingredientes, pasos y tiempos de preparación.</p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <form id="recipe-form" class="toolbar" role="search" novalidate>
          <div class="field">
            <label for="recipe-search">Buscar receta</label>
            <input id="recipe-search" type="search" placeholder="Ej.: arroz, lentejas…" autocomplete="off">
          </div>
          <button class="btn btn--primary" type="submit">Buscar</button>
        </form>
        <div class="filters">
          <label class="switch"><input type="checkbox" id="recipe-fav"><span>Solo favoritas</span></label>
        </div>
        <div id="recipe-categories" class="chips" role="group" aria-label="Filtrar por categoría"></div>
        <p id="recipe-count" class="muted small" aria-live="polite"></p>
        <div id="recipe-grid" class="grid grid--3" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/config.js"></script>
  <script src="../js/mock-data.js"></script>
  <script type="module" src="../js/recetas.js"></script>
</body>
</html>
